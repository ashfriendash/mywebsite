
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102219">

    <title>The Lost Forest</title>

    <link rel="stylesheet" href="title.css">

    <style>
        

        .title-content .forest-minigames {
            position: relative;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: stretch;
            flex-wrap: wrap;
            gap: 9px;
            width: 100%;
            max-width: 440px;
            margin: 17px auto 0;
        }

        .forest-minigame-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            flex: 1 1 175px;
            min-width: 0;
            max-width: 100%;
            padding: 9px 12px;
            border: 1px solid rgba(224, 211, 164, 0.24);
            border-radius: 999px;
            background: rgba(12, 29, 20, 0.48);
            color: #e7e0c7;
            text-decoration: none;
            text-align: left;
            box-shadow: 0 0 16px rgba(221, 201, 132, 0.025);
            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.25s ease;
            animation: forestSecretGlow 4s ease-in-out infinite;
        }

        .forest-minigame-link:nth-child(2) {
            animation-delay: 1.3s;
        }

        .forest-minigame-link:hover {
            background: rgba(37, 61, 40, 0.78);
            border-color: rgba(239, 221, 164, 0.62);
            box-shadow: 0 0 20px rgba(221, 201, 132, 0.12);
            transform: translateY(-2px);
        }

        .forest-minigame-link:focus-visible {
            outline: 2px solid #eadba6;
            outline-offset: 4px;
        }

        .forest-minigame-icon {
            flex-shrink: 0;
            color: #efdc9b;
            font-size: 19px;
            line-height: 1;
            text-shadow: 0 0 10px rgba(247, 222, 142, 0.55);
            animation: forestSecretFlicker 3s ease-in-out infinite;
        }

        .forest-minigame-copy {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .forest-minigame-copy strong {
            color: #f0e4bf;
            font-family: "Cinzel", serif;
            font-size: 10px;
            font-weight: 600;
            line-height: 1.35;
            letter-spacing: 0.015em;
        }

        .forest-minigame-copy small {
            color: #bfcbb7;
            font-size: 9px;
            line-height: 1.35;
        }

        .forest-minigame-arrow {
            flex-shrink: 0;
            margin-left: auto;
            color: #d4c89c;
            font-size: 12px;
            opacity: 0.65;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .forest-minigame-link:hover .forest-minigame-arrow {
            transform: translate(2px, -2px);
            opacity: 1;
        }

        @keyframes forestSecretGlow {
            0%, 100% {
                box-shadow: 0 0 8px rgba(221, 201, 132, 0.02);
            }
            50% {
                box-shadow: 0 0 15px rgba(221, 201, 132, 0.075);
            }
        }

        @keyframes forestSecretFlicker {
            0%, 100% {
                opacity: 0.72;
            }
            50% {
                opacity: 1;
                text-shadow: 0 0 13px rgba(247, 222, 142, 0.85);
            }
        }

        @media (max-width: 420px) {
            .title-content .forest-minigames {
                gap: 7px;
                margin-top: 13px;
            }

            .forest-minigame-link {
                flex-basis: 160px;
                padding: 8px 10px;
                gap: 7px;
            }

            .forest-minigame-copy strong {
                font-size: 9px;
            }

            .forest-minigame-copy small {
                font-size: 8px;
            }

            .forest-minigame-icon {
                font-size: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .forest-minigame-link,
            .forest-minigame-icon,
            .forest-minigame-arrow {
                animation: none;
                transition: none;
            }
        }
    </style>
    <script src="audio.js" defer></script>
</head>

<body class="title-page">

    <main class="title-screen">

        <div class="atmosphere"></div>

        <section class="title-content">

            <div class="title-ornament">
                <span></span>
                <i></i>
                <span></span>
            </div>

            <h1>
                <span>THE</span>
                LOST FOREST
            </h1>

            <div class="title-divider">
                <span></span>
                <b></b>
                <span></span>
            </div>

            <a href="game.html" class="start-button">
                <span class="start-icon">▶</span>
                <span>START ADVENTURE</span>
            </a>

            <div class="forest-minigames">

                <a href="firefly.html" class="forest-minigame-link">
                    <span class="forest-minigame-icon" aria-hidden="true"></span>

                    <span class="forest-minigame-copy">
                        <strong>Follow the Firefly</strong>
                        <small>A bonus game</small>
                    </span>

                    <span class="forest-minigame-arrow" aria-hidden="true">↗</span>
                </a>

                <a href="memory.html" class="forest-minigame-link">
                    <span class="forest-minigame-icon" aria-hidden="true"></span>

                    <span class="forest-minigame-copy">
                        <strong>Remember the Forest</strong>
                        <small>A five-level memory game</small>
                    </span>

                    <span class="forest-minigame-arrow" aria-hidden="true">↗</span>
                </a>

            </div>

        </section>

        <div class="corner corner-top-left"></div>
        <div class="corner corner-top-right"></div>
        <div class="corner corner-bottom-left"></div>
        <div class="corner corner-bottom-right"></div>

        <div class="particles" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

    </main>

<script>
(() => {
    "use strict";

    const NAVIGATION_DELAY = 5700;
    let starting = false;

    function playEpicOpening() {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return false;

        let ctx;

        try {
            ctx = new AudioContextClass();

            const master = ctx.createGain();
            master.gain.value = 0.72;
            master.connect(ctx.destination);

            if (ctx.state === "suspended") {
                ctx.resume().catch(() => {});
            }

            const start = ctx.currentTime + 0.06;

            function note(freq, time, length, volume, wave = "sine", endFreq = null) {
                const oscillator = ctx.createOscillator();
                const envelope = ctx.createGain();
                const filter = ctx.createBiquadFilter();

                const when = start + time;
                const attack = Math.min(0.22, length * 0.25);

                oscillator.type = wave;
                oscillator.frequency.setValueAtTime(freq, when);

                if (endFreq && endFreq > 0) {
                    oscillator.frequency.exponentialRampToValueAtTime(
                        endFreq, when + length
                    );
                }

                filter.type = "lowpass";
                filter.frequency.setValueAtTime(
                    wave === "sawtooth" ? 1800 : 5000, when
                );

                envelope.gain.setValueAtTime(0.0001, when);
                envelope.gain.exponentialRampToValueAtTime(
                    Math.max(0.0002, volume), when + Math.max(0.02, attack)
                );
                envelope.gain.setTargetAtTime(
                    0.0001,
                    when + length * 0.72,
                    Math.max(0.07, length * 0.16)
                );

                oscillator.connect(filter);
                filter.connect(envelope);
                envelope.connect(master);

                oscillator.start(when);
                oscillator.stop(when + length + 0.35);
            }

            function impact(time, volume = 0.16) {
                note(90, time, 0.85, volume, "sine",  thirtyFive());
            }

            function thirtyFive() {
                return 35;
            }

            impact(0, 0.21);
            impact(1.65, 0.09);

            [
                [65.41, 0.10],
                [98.00, 0.075],
                [130.81, 0.065],
                [196.00, 0.045],
                [261.63, 0.035]
            ].forEach(([freq, vol]) => {
                note(freq, 0.05, 4.5, vol, "triangle");
            });

            const fanfare = [
                [392.00, 0.35, 0.30, 0.075],
                [523.25, 0.67, 0.34, 0.085],
                [659.25, 1.00, 0.36, 0.095],
                [783.99, 1.35, 0.48, 0.105],
                [1046.50, 1.82, 0.62, 0.11],
                [987.77, 2.48, 0.32, 0.085],
                [1174.66, 2.80, 0.40, 0.10],
                [1318.51, 3.18, 0.52, 0.105],
                [1567.98, 3.68, 0.85, 0.085]
            ];

            fanfare.forEach(([freq, time, len, vol]) => {
                note(freq, time, len, vol, "sawtooth");
                note(freq * 2, time + 0.025, len * 0.72, vol * 0.18);
            });

            [
                [523.25, 4.05, 1.35, 0.085],
                [659.25, 4.05, 1.30, 0.075],
                [783.99, 4.05, 1.40, 0.075],
                [1046.50, 4.12, 1.45, 0.065],
                [1567.98, 4.20, 1.20, 0.035]
            ].forEach(([freq, time, len, vol]) => {
                note(freq, time, len, vol);
            });

            window.setTimeout(() => {
                ctx.close().catch(() => {});
            }, 5500);

            return true;
        } catch (error) {
            console.warn("Epic opening theme failed:", error);

            try {
                if (ctx && ctx.state !== "closed") {
                    ctx.close().catch(() => {});
                }
            } catch (_) {}

            return false;
        }
    }

    document.addEventListener("click", event => {
        const origin = event.target instanceof Element
            ? event.target
            : event.target?.parentElement;

        const link = origin?.closest("a[href]");

        if (!link) return;

        const label = (link.innerText || link.textContent || "")
            .replace(/\s+/g, " ")
            .trim();

        if (!/\bstart\s+(?:the\s+)?adventure\b/i.test(label)) return;

        if (
            event.button !== 0 ||
            event.ctrlKey ||
            event.metaKey ||
            event.shiftKey ||
            event.altKey ||
            link.target === "_blank" ||
            link.hasAttribute("download")
        ) return;

        if (starting) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return;
        }

        const destination = link.href;
        const started = playEpicOpening();

        if (!started) return;

        event.preventDefault();
        event.stopImmediatePropagation();
        starting = true;

        window.setTimeout(() => {
            window.location.assign(destination);
        }, NAVIGATION_DELAY);
    }, true);
})();
</script>

</body>
</html>
