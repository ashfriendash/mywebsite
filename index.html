<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <body>

    <!-- LEFT SIDE: GAME ACTIONS -->
    <div class="action-panel">

        <h2>🎒 Actions</h2>

        <button onclick="LooseHealth(20)">
            🪨 Touch the Cursed Stone
        </button>

        <button onclick="GainGold(25)">
            💰 Pick up Gold
        </button>

        <button onclick="FindKey()">
            🗝️ Pick up Key
        </button>

        <button onclick="Heal()">
            🧪 Drink Potion
        </button>

        <h2>💎 Treasure</h2>

        <button onclick="OpenChest()">
            📦 Open Chest
        </button>

    </div>


    <!-- CENTER: MAIN STORY -->
    <div class="story-box">

        <!-- PLAYER STATS -->
        <div class="stats">

            <p id="health">❤️ Health: 100</p>

            <p id="gold">💰 Gold: 0</p>

            <p id="keys">🗝️ Keys: 0</p>

        </div>


        <h1>The Lost Forest</h1>

        <p>
            You wake up in a mysterious forest
        </p>

        <p>
            Two paths stretch before you.
            One disappears into darkness.
            The other glows with warm sunlight.
        </p>


        <!-- STORY CHOICES -->
        <div class="choices">

            <a href="left.html">Go Left</a>

            <a href="right.html">Go Right</a>

        </div>

    </div>


    <!-- NOTIFICATION -->
    <div id="notification">

        <div id="notifTitle"></div>

        <div id="notifText"></div>

    </div>


    <script src="script.js"></script>

</body>
</html>
