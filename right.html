<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102219">
    <title>The Coniferous Path</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        body.right-path-page {
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: auto;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
            padding: clamp(10px, 2.2vh, 18px);
        }

        body.right-path-page > .story-box {
            box-sizing: border-box;
            flex: 0 0 auto;
            max-width: 100%;
            margin: 0 auto 12px;
        }

        body.right-path-page .choices,
        body.right-path-page .back-button {
            max-width: 100%;
        }

        body.right-path-page .choices {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        body.right-path-page .choices a {
            box-sizing: border-box;
            max-width: 100%;
        }

        @media (max-width: 480px) {
            body.right-path-page {
                padding: 10px;
            }

            body.right-path-page > .story-box {
                width: 100%;
            }
        }
    </style>

    <script src="audio.js" defer></script>
</head>
<body class="right-path-page">
    <main class="story-box">
        <div class="stats">
            <p id="health"> Health: 100</p>
            <p id="gold"> Gold: 0</p>
            <p id="keys"> Keys: 0</p>
            <p id="potion-count"> Potions: 0</p>
        </div>

        <div class="utility-row">
            <button type="button" class="use-potion-button" onclick="Heal()">
                Drink Potion
            </button>
        </div>

        <h1>The Coniferous Path</h1>

        <p>
            Theres cones around you DAMNIt
        </p>

        <p>
            do you wanna go down the muddy path or the ominous one
        </p>

        <p>
            Choose randomly or not bro
        </p>

        <p>
            <strong>
                The DragonDen is locked.
                You need 15 keys to open the gate.
            </strong>
        </p>

        <div class="choices">
            <a href="keyhunt.html"> Key Hunt</a>
            <a href="dragon.html">DragonDen</a>
        </div>

        <div class="back-button">
            <a href="game.html"> Return to Forest Entrance</a>
        </div>
    </main>

    <div id="notification" role="status" aria-live="polite">
        <div id="notifTitle"></div>
        <div id="notifText"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
